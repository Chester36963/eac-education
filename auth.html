<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EAC Education — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/decorations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/site.css">

  <style>
    body {
      background-color: var(--bg-tertiary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-container {
      max-width: 480px;
      width: 100%;
      padding: var(--spacing-lg);
    }

    .auth-card {
      background-color: var(--bg-white);
      border: var(--border-light);
      border-radius: 12px;
      padding: var(--spacing-3xl);
      box-shadow: var(--shadow-subtle);
    }

    .auth-header {
      text-align: center;
      margin-bottom: var(--spacing-2xl);
    }

    .auth-header h1 {
      font-family: var(--font-serif-display);
      font-size: 36px;
      font-weight: 600;
      color: var(--navy-dark);
      margin-bottom: var(--spacing-sm);
    }

    .auth-header p {
      color: var(--text-light);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: var(--spacing-lg);
    }

    .form-group label {
      display: block;
      font-weight: 600;
      color: var(--navy-dark);
      margin-bottom: var(--spacing-sm);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-group input {
      width: 100%;
      padding: var(--spacing-md) var(--spacing-lg);
      border: var(--border-main);
      border-radius: 8px;
      font-family: var(--font-stack);
      font-size: 15px;
      color: var(--text-primary);
      transition: var(--transition-smooth);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-rose);
      box-shadow: 0 0 0 3px rgba(252, 169, 169, 0.1);
    }

    .form-group input::placeholder {
      color: var(--text-light);
    }

    .error-message {
      color: #c62828;
      font-size: 13px;
      margin-top: 6px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .submit-btn {
      width: 100%;
      padding: var(--spacing-md) var(--spacing-lg);
      background-color: var(--navy-dark);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: var(--font-serif-body);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
      margin-top: var(--spacing-lg);
    }

    .submit-btn:hover {
      background-color: var(--navy-medium);
    }

    .auth-toggle {
      text-align: center;
      margin-top: var(--spacing-2xl);
      padding-top: var(--spacing-lg);
      border-top: var(--border-light);
      color: var(--text-secondary);
      font-size: 14px;
    }

    .auth-toggle a {
      color: var(--navy-dark);
      text-decoration: none;
      font-weight: 600;
      border: none;
    }

    #register-form {
      display: none;
    }

    .form-group.hidden {
      display: none;
    }

    .success-message {
      background-color: rgba(45, 80, 22, 0.05);
      color: #2d5016;
      padding: var(--spacing-lg);
      border-radius: 8px;
      margin-bottom: var(--spacing-lg);
      border-left: 3px solid #2d5016;
      display: none;
    }

    .success-message.show {
      display: block;
    }
  </style>
</head>
<body class="auth-page">
  <a class="auth-home-link" href="index.html">← EAC Education</a>
  <div class="auth-container">
    <div class="auth-card">
      <p class="eyebrow">STUDENT STUDIO · 學生專區</p>
      <div class="auth-preview"><strong>目前開放本機試用</strong><p>帳戶及進度只儲存在此瀏覽器，未能跨裝置同步。試用註冊請使用測試電郵及專用密碼。</p><button class="submit-btn" type="button" onclick="enterPreview()">直接試用練習室 →</button><p id="preview-error" role="alert"></p></div>
      <!-- Login Form -->
      <div id="login-form">
        <div class="auth-header">
          <h1>Student login</h1>
          <p>Sign in to your student account · 登入學生帳戶</p>
        </div>

        <div class="success-message" id="login-success"></div>

        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" autocomplete="username" placeholder="your@email.com" required>
            <div class="error-message" id="login-email-error"></div>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••" required>
            <div class="error-message" id="login-password-error"></div>
          </div>

          <button type="submit" class="submit-btn">登入 / Sign in</button>
        </form>

        <div class="auth-toggle">
          Don't have an account? <a href="javascript:void(0)" onclick="toggleForms()">Create one</a>
        </div>
      </div>

      <!-- Register Form -->
      <div id="register-form">
        <div class="auth-header">
          <h1>Get Started</h1>
          <p>建立本機試用帳戶 · Local preview account</p>
        </div>

        <div class="success-message" id="register-success"></div>

        <form onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="register-email">Email</label>
            <input type="email" id="register-email" autocomplete="email" placeholder="your@email.com" required>
            <div class="error-message" id="register-email-error"></div>
          </div>

          <div class="form-group">
            <label for="register-username">Username</label>
            <input type="text" id="register-username" autocomplete="nickname" minlength="3" placeholder="Your name" required>
            <div class="error-message" id="register-username-error"></div>
          </div>

          <div class="form-group">
            <label for="register-password">Password</label>
            <input type="password" id="register-password" autocomplete="new-password" minlength="6" placeholder="••••••••" required>
            <div class="error-message" id="register-password-error"></div>
          </div>

          <button type="submit" class="submit-btn">建立試用帳戶</button>
        </form>

        <div class="auth-toggle">
          Already have an account? <a href="javascript:void(0)" onclick="toggleForms()">Sign in</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/core/config.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/auth.js"></script>

  <script>
    const requested = new URLSearchParams(location.search).get('next') || 'dashboard.html';
    const destination = /^(?:app|settings)\.html(?:\?[^#]*)?$/.test(requested) ? requested : 'dashboard.html';
    function enterPreview() {
      const existing = Storage.getUser();
      if (existing) {
        sessionStorage.setItem('currentUserId', existing.id);
        location.href = destination;
        return;
      }
      const result = Auth.register('preview@example.invalid', crypto.randomUUID(), 'Student');
      if (result.success) location.href = destination;
      else document.getElementById('preview-error').textContent = result.error;
    }
    function toggleForms() {
      document.getElementById('login-form').style.display = document.getElementById('login-form').style.display === 'none' ? 'block' : 'none';
      document.getElementById('register-form').style.display = document.getElementById('register-form').style.display === 'block' ? 'none' : 'block';
      clearErrors();
    }

    function clearErrors() {
      document.querySelectorAll('.error-message').forEach(el => el.classList.remove('show'));
      document.querySelectorAll('.success-message').forEach(el => el.classList.remove('show'));
    }

    function handleLogin(event) {
      event.preventDefault();
      clearErrors();

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const result = Auth.login(email, password);

      if (result.success) {
        const successMsg = document.getElementById('login-success');
        successMsg.textContent = result.message;
        successMsg.classList.add('show');
        setTimeout(() => {
          window.location.href = destination;
        }, 1500);
      } else {
        showError('login-email-error', result.error);
      }
    }

    function handleRegister(event) {
      event.preventDefault();
      clearErrors();

      const email = document.getElementById('register-email').value;
      const username = document.getElementById('register-username').value;
      const password = document.getElementById('register-password').value;

      const result = Auth.register(email, password, username);

      if (result.success) {
        const successMsg = document.getElementById('register-success');
        successMsg.textContent = result.message;
        successMsg.classList.add('show');
        setTimeout(() => {
          window.location.href = destination;
        }, 1500);
      } else {
        showError('register-email-error', result.error);
      }
    }

    function showError(elementId, message) {
      const el = document.getElementById(elementId);
      if (el) {
        el.textContent = message;
        el.classList.add('show');
      }
    }

    // Check if already logged in
    if (Auth.isAuthenticated()) {
      window.location.href = destination;
    }
  </script>
</body>
</html>
