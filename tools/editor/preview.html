<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/student/"><title>EAC · 題面草稿預覽</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/site.css"><link rel="stylesheet" href="css/journey.css"><link rel="stylesheet" href="css/study.css"><link rel="stylesheet" href="css/math.css"><link rel="stylesheet" href="css/workspace.css"><script src="js/core/math.js"></script><script defer src="vendor/mathjax/tex-svg.js"></script><body class="student-shell"><main style="max-width:850px;margin:auto;padding:24px"><p class="eyebrow">DRAFT PREVIEW · 未發布草稿</p><article class="bank-preview" id="draft-view"></article><details><summary>編輯者查看解答（學生題面不顯示）</summary><div id="draft-solution"></div></details></main><script>addEventListener('message',async e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='eac-preview')return;const q=structuredClone(e.data.question);const map=d=>{if(!/^assets\/[a-zA-Z0-9_./-]+\.(svg|png|jpe?g|webp)$/.test(d.src)||d.src.split('/').includes('..')){d.src='';return;}if(d.src.startsWith('assets/intake/'))d.src='/staged/'+e.data.batchId+'/'+d.src;else d.src='/student/'+d.src;};if(q.diagram)map(q.diagram);for(const blocks of Object.values(q.contentBlocks||{}))for(const b of blocks)if(b.type==='figure')map(b.diagram);EACMath.clear(document.getElementById('draft-view'));EACMath.preview(document.getElementById('draft-view'),q,e.data.language);document.getElementById('draft-solution').textContent=e.data.language==='en'?q.solution:e.data.language==='zh'?q.solutionZh:[q.solution,q.solutionZh].filter(Boolean).join('\n\n');await EACMath.render(document.querySelector('main'));document.body.dataset.preview=q.id+':'+e.data.language;});</script></body></html>
