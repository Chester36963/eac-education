name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup exact mathematics checks
        run: python3 -m pip install -r requirements-math.txt

      - name: Check learning records and content
        run: |
          node scripts/build-curriculum.cjs --check
          node scripts/build-content.cjs --check
          node --test tests/*.cjs
          python3 -m json.tool src/data/catalog.json > /dev/null
          python3 -m json.tool src/data/questions.json > /dev/null

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src
          cname: # Leave empty for username.github.io, or add custom domain

      - name: Verify deployment
        run: echo "Deployment to GitHub Pages completed successfully"
