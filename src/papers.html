<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EAC Education · 我的試卷</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/papers.css?v=6227f3093ea4"><link rel="stylesheet" href="css/math.css"><script src="js/core/math.js?v=c8546b662122"></script><script defer src="vendor/mathjax/tex-svg.js"></script></head><body>
<header><a href="dashboard.html">EAC Education / Chester</a><nav><a href="courses.html">課程目錄</a><a href="library.html">題庫</a><a href="app.html?resume=1">接住上次</a></nav></header>
<main><p class="eyebrow">THE PAPER STUDIO / 組卷工作室</p><h1>為下一次進步，<br>編一份練習。</h1><p>跨課題揀題、調整次序，儲存後隨時重做。試卷只儲存在目前瀏覽器。</p><p id="status" role="status" aria-live="polite">載入題庫中…</p>
<section class="paper-settings" aria-label="試卷設定"><label>試卷名稱<input id="title" value="我的練習卷" maxlength="120"></label><label>課程<select id="course"></select></label><label>已儲存試卷<select id="saved"><option value="">選擇試卷</option></select></label><button id="new">新建</button><button id="copy">另存新版本</button><button id="delete">刪除此已存試卷</button><label>建議作答時間（分鐘；0 為不指定）<input id="minutes" type="number" min="0" max="300" value="0"></label></section>
<a class="arrangement-link" href="#paper-arrangement">前往已選題目及儲存 ↓</a><div class="paper-layout"><section><h2>01 / 揀題目</h2><div class="filters"><label>課題<select id="topic"></select></label><label>細分類<select id="subcategory"></select></label><label>技巧<select id="skill"></select></label><label>難度<select id="difficulty"><option value="all">全部難度</option><option value="easy">基礎</option><option value="medium">進階</option><option value="hard">挑戰</option><option value="challenging">進階挑戰</option></select></label><label>題型<select id="type"></select></label><label>搜尋題文／題號<input id="query" type="search"></label></div><div class="auto"><label>自動補入題數<input id="amount" type="number" value="5" min="1" max="100"></label><button id="auto">從目前範圍隨機補入</button></div><details class="quota-builder"><summary>按課題分配題量 / Topic quotas</summary><p>各課題配額會套用目前難度／題型，其他搜尋及技巧篩選不適用。補入題目不重複；不足會列明。</p><div id="quotas"></div><button id="allocate">按配額補入試卷</button></details><p id="count"></p><div id="results"></div><button id="more" hidden>顯示更多</button></section>
<aside id="paper-arrangement"><h2>02 / 編排試卷</h2><p id="summary"></p><ol id="selected"></ol><div class="actions"><button id="save">儲存試卷</button><button id="start">儲存並網上作答 →</button></div><p>選擇題／數值短答按題目規則核對；書寫題對照詳解自評。分數為你自訂的練習配分，不代表原卷或自動評分標準。建議時間不會自動交卷；列印功能仍在準備。</p></aside></div></main>
<dialog id="preview"><button id="close">關閉預覽</button><div id="question"></div></dialog>
<script src="js/core/config.js"></script><script src="js/core/storage.js"></script><script src="js/core/auth.js"></script><script src="js/core/learning.js?v=5e3b6432a7a1"></script><script src="js/core/content.js"></script><script src="js/core/question-bank.js"></script><script src="js/core/papers.js?v=501401530bac"></script><script src="js/features/papers.js?v=0ed5d0c935f4"></script></body></html>
